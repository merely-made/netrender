[workspace]
members = [
    "netrender_device",
    "netrender",
    "netrender_text",
    "paint_list_api",
    "paint_list_render",
]
resolver = "2"

# Centralized load-bearing pins. Each crate that uses one of these
# declares it with `<dep>.workspace = true` instead of pinning the
# version directly. Prevents the version-skew risk flagged in the
# 2026-05-16 audit (three crates each pinning wgpu independently)
# and matches the Mere workspace convention.
[workspace.dependencies]
# Linebender visual stack.
vello = { package = "netrender-vello", version = "0.11.0", git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a", default-features = false }
# Sparse Strips release family, with the maintained bounded append extension.
# CPU/GPU/common/Glifo share one provider source. The vello_hybrid dependency
# alias preserves existing adapter names while selecting the vello_gpu package.
vello_cpu = { package = "vello_cpu", version = "0.3.0", git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a", default-features = false }
vello_hybrid = { package = "vello_gpu", version = "0.3.0", git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a", default-features = false }
vello_sparse_common = { package = "vello_common", version = "0.3.0", git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a", default-features = false }
wgpu = { version = "30", default-features = false }
peniko = "0.6"
parley = "0.12"
# Tracks the glyph ABI of Vello 0.11 / Glifo 0.4 and Parley 0.12.
# Their compatible release family uses Skrifa 0.44 / read-fonts 0.41;
# do not independently select a newer glyph-provider minor.
skrifa = "0.44"

# Cross-cutting.
log = "0.4"
serde = { version = "1", features = ["derive"] }
# euclid pinned to match genet + inker so the PaintList vocabulary's
# geometry types share identity across the path-dep boundary (extraction
# plan risk #4). `serde` feature on so Layout* types (de)serialize.
euclid = { version = "0.22", features = ["serde"] }

[profile.release]
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
