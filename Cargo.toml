[workspace]
members = [
    "netrender_device",
    "netrender",
    "netrender_text",
    "paint_list_api",
    "paint_list_render",
]
resolver = "2"

# Centralized load-bearing pins. Each crate that uses one of these
# declares it with `<dep>.workspace = true` instead of pinning the
# version directly. Prevents the version-skew risk flagged in the
# 2026-05-16 audit (three crates each pinning wgpu independently)
# and matches the Mere workspace convention.
[workspace.dependencies]
# Linebender visual stack.
vello = { package = "netrender-vello", version = ">=0.12.0", default-features = false }
# Sparse Strips release family, with the maintained bounded append extension.
# CPU/GPU/common/Glifo share one provider source. The vello_hybrid dependency
# alias preserves existing adapter names while selecting the netrender-gpu package.
vello_cpu = { package = "netrender-cpu", version = ">=0.4.0", default-features = false }
vello_hybrid = { package = "netrender-gpu", version = ">=0.4.0", default-features = false }
vello_sparse_common = { package = "netrender-sparse", version = ">=0.4.0", default-features = false }
wgpu = { version = "30.0.2", default-features = false }
peniko = "0.6"
parley = ">=0.12.0"
# Share outline drawing with Vello 0.12 and Glifo 0.5.
skrifa = ">=0.49.0"

# Cross-cutting.
log = "0.4"
serde = { version = "1", features = ["derive"] }
# euclid pinned to match genet + inker so the PaintList vocabulary's
# geometry types share identity across the path-dep boundary (extraction
# plan risk #4). `serde` feature on so Layout* types (de)serialize.
euclid = { version = "0.22", features = ["serde"] }

[profile.release]
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
