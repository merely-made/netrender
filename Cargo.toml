[workspace]
members = [
    "netrender_device",
    "netrender",
    "netrender_text",
    "paint_list_api",
    "paint_list_render",
]
resolver = "2"

# Centralized load-bearing pins. Each crate that uses one of these
# declares it with `<dep>.workspace = true` instead of pinning the
# version directly. Prevents the version-skew risk flagged in the
# 2026-05-16 audit (three crates each pinning wgpu independently)
# and matches the Mere workspace convention.
[workspace.dependencies]
# Linebender visual stack.
vello = { package = "netrender-vello", version = "0.10.0", default-features = false }
# Experimental sparse-strips backends. Both are pinned to the same
# consumer branch so Hybrid's wgpu types stay unified with Netrender's
# device and the retained-scene append prototype is reproducible.
vello_cpu = { git = "https://github.com/mark-ik/vello", rev = "ca3f40ea182216883cd543c7b9deae991268917c", default-features = false }
vello_hybrid = { git = "https://github.com/mark-ik/vello", rev = "ca3f40ea182216883cd543c7b9deae991268917c", default-features = false }
vello_sparse_common = { package = "vello_common", git = "https://github.com/mark-ik/vello", rev = "ca3f40ea182216883cd543c7b9deae991268917c", default-features = false }
wgpu = { version = "30", default-features = false }
peniko = "0.6"
parley = "0.10"
# Tracks vello's transitive skrifa (0.10 moved 0.42 -> 0.44), because
# `vello_rasterizer::emit` hands skrifa-resolved variation coords straight
# to vello. parley 0.10 still wants 0.42, so a second skrifa copy resolves
# for netrender_text; that is bloat, not a break, since no skrifa type
# crosses the parley -> netrender::Scene adapter boundary.
skrifa = "0.44"

# Cross-cutting.
log = "0.4"
serde = { version = "1", features = ["derive"] }
# euclid pinned to match genet + inker so the PaintList vocabulary's
# geometry types share identity across the path-dep boundary (extraction
# plan risk #4). `serde` feature on so Layout* types (de)serialize.
euclid = { version = "0.22", features = ["serde"] }

[profile.release]
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
