[package]
name = "webrender_build"
authors = ["The Servo Project Developers"]
version.workspace = true
license = "MPL-2.0"
repository = "https://github.com/servo/webrender"
description = "Code shared between precompilation (build.rs) and the rest of WebRender"
edition = "2018"

[features]
serialize_program = ["serde"]
shader_census = ["serde", "dep:naga", "dep:serde_json", "dep:sha2", "dep:shaderc"]
shader_census_wgpu_smoke = ["shader_census", "dep:pollster", "dep:wgpu"]

[dependencies]
bitflags = "2"
lazy_static = "1"
serde = { optional = true, version = "1.0", features = ["serde_derive"] }
serde_json = { optional = true, version = "1.0" }
sha2 = { version = "0.10", optional = true }
naga = { version = "=30.0.1", optional = true, features = ["glsl-in", "spv-in", "wgsl-out"] }
shaderc = { version = "=0.10.1", optional = true }
pollster = { version = "=0.4.0", optional = true }
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[[bin]]
name = "shader-census"
path = "src/bin/shader_census.rs"
required-features = ["shader_census"]

[[bin]]
name = "shader-census-wgpu-smoke"
path = "src/bin/shader_census_wgpu_smoke.rs"
required-features = ["shader_census_wgpu_smoke"]
