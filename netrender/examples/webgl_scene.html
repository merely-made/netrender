<!doctype html><meta charset="utf-8"><canvas id="canvas" width="128" height="128"></canvas><pre id="result">pending</pre>

try {
 stage="wasm init"; await init(); stage="fixture constructor"; let fixture=new WebGlFixture(canvas,1n); stage="shader init"; await ready(fixture);
 renderer=fixture.renderer();

 steps.push({name:'late-refusal-preserves-frame-and-resources'});

 stage='context restoration'; const restored=new Promise(resolve=>canvas.addEventListener('webglcontextrestored',resolve,{once:true}));await frame(); loss.restoreContext();await Promise.race([restored,new Promise((_,reject)=>setTimeout(()=>reject(new Error('context restoration event timeout')),10000))]);

 let old=false;try{fixture.render_case('red',1n)}catch(error){old=String(error).includes('StaleGeneration')}

 steps.push({name:'loss-restoration-stale-refusal',generation:2});

 document.title='PASS';fixture.free();
} catch(error){document.querySelector('#result').textContent=JSON.stringify({result:'fail',stage,renderer,error:String(error),stack:error.stack,steps});document.title='FAIL'} finally { await fetch('/result',{method:'POST',body:document.querySelector('#result').textContent}); }
</script>
