[package]
name = "paint_list_render"
version = "0.1.2"
license = "MPL-2.0"
repository = "https://github.com/merely-made/netrender"
readme = "../README.md"
description = "Translator from the paint_list_api PaintCmd vocabulary into netrender::Scene (the impedance bridge between engine-facing display lists and renderer primitives)."
edition = "2021"

[features]
replay-cpu = ["netrender/vello-cpu"]
replay-hybrid = ["netrender/vello-hybrid"]
resource-bundle = ["netrender/serde", "dep:serde", "dep:serde_json", "dep:postcard", "dep:sha2", "dep:skrifa"]

[dependencies]
log.workspace = true
netrender = { version = "0.1.2", path = "../netrender" }
paint_list_api = { version = "0.1.2", path = "../paint_list_api" }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
sha2 = { version = "0.11", optional = true }
skrifa = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
# Corpus fixtures (tests/corpus/*.paintlist) are postcard-encoded
# PaintEnvelopes. Same encoding netrender's A2 Scene capture uses.
postcard = { version = "1", features = ["alloc"] }
# pe4 leaf-fragment e2e boots a real device and reads pixels back.
wgpu.workspace = true
png = "0.17"
serde_json = "1"
sha2 = "0.11"
skrifa.workspace = true

[[example]]
name = "resource_bundle_parity"
required-features = ["resource-bundle"]

[[example]]
name = "classic_edge_probe"
required-features = ["resource-bundle"]
