# ─── Cross-repo render-stack alignment (Mere → Genet) ───────────────────────
# Livery/Buckram consume Genet's Taffy fork directly. The retired Stylo layout
# cone has no root patch in this workspace.
[patch.crates-io]
# gaz (dramatis) takes muniment from crates.io so dramatis never pins mere;
# this swaps in mere's own, so the graph holds one muniment and castellan's
# stores and gaz's agree on its types.
muniment = { path = "/Users/markik/Code/worktrees/mere-vello-cpu-source/crates/eidetic/muniment" }
# Vello on wgpu 30, from the owned fork. Upstream vello 0.10 still requires
# wgpu 29 and their own migration PR is stalled, so netrender (and through it
# this workspace's render path) takes vello from the v0.10.0 tag plus the API
# changes in linebender/vello#1754. `[patch]` is not inherited from genet or
# netrender, so this workspace restates it. Retires by deletion when upstream
# ships a wgpu-30 vello.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
# Radeon coarse repair plus validated native shader command progress guards.
# Keep Classic and its encoding/shader types on the same 0.10 maintenance source.
