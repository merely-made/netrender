vello_shaders = { git = "https://github.com/mark-ik/vello.git", rev = "10f01d6d88e94eac087daf033b24895cf97b8e82" }
# cubecl-wgpu 0.10.0, vendored from the registry and moved to wgpu 30. This is
# the "narrow CubeCL backport" of the 2026-08-15 wgpu 30 unification: it is the
# ONLY crate in the burn 0.21 / cubecl 0.10 stack that names wgpu at all, so
# one vendored crate carries the whole resident lane across the major.
#
# The alternative was burn 0.22.0-pre.2 with cubecl 0.11.0-pre.2, which already
# require wgpu ^30. When this was written that was not resolvable, because
# cubecl-runtime 0.11 depends on cubecl-environment with the `cache` feature
# NON-optionally, pulling rusqlite 0.40 -> libsqlite3-sys ^0.38, while this
# graph also carried sqlx -> libsqlite3-sys <0.38. libsqlite3-sys sets
# `links = "sqlite3"`, so exactly one may exist in a graph.
#
# 2026-08-16: OUR HALF OF THAT CONFLICT IS GONE. sqlx and libsqlite3-sys are no
# longer in this workspace's graph at all. The note above misattributed the
# cause to p2panda-store's `groups`/`encryption` features; `cargo tree -e
# features` showed neither was ever enabled here. The real enablers were
# `p2panda-net/address_book`, which forced `p2panda-store/sqlite` outright, and
# `p2panda-store/default` arriving through p2panda-sync and p2panda-stream. The
# address book now runs on stickleback's muniment-backed store and every
# consumer opts out of the `sqlite` feature. See docs:
# 2026-08-16_address_book_muniment_port_plan.md.
#
# So this vendored crate is now retire-ABLE on the sqlite axis, but that has not
# been attempted: whether burn 0.22.0-pre.2 / cubecl 0.11.0-pre.2 resolve and
# behave here is the burn migration's question, not this patch entry's. See
# docs: 2026-08-09_burn_0_22_migration_plan.md.
# RETIRED 2026-08-20 with the burn 0.22 migration: cubecl-wgpu 0.11.0-pre.2
# from the registry already names wgpu 30, which is all the vendored backport
# existed to do. The vendored copy remains at support/patches/cubecl-wgpu for
# archaeology until a stable 0.22 lands, but it is no longer patched in.
# cubecl-wgpu = { path = "/Users/markik/Code/worktrees/mere-vello-cpu-source/support/patches/cubecl-wgpu" }
# cubecl-runtime 0.11.0: the source is pristine upstream. The manifest
# removes persistence from default features (ruling 375), avoiding the Turso
# cache in Mere's defaults-disabled GPU graph. Remove when upstream makes
# persistence opt-in or fixes the defaults-on edge in cubecl-wgpu.
cubecl-runtime = { path = "/Users/markik/Code/worktrees/mere-vello-cpu-source/support/patches/cubecl-runtime" }
# burn-cubecl 0.22.0-pre.4: the selector was retired under ruling 410 after
# the old pre.2 browser failure reproduced while upstream pre.4 passed all 21
# cases, plus nine unfused native launcher controls. Vendored patch source
# remains for provenance; current consumers select the registry crate.
# burn-remote 0.22.0: pump-observed targeted close and session receipts
# let owner reclaim stop one admitted lease without dropping the protocol.
# Remove when upstream provides equivalent control and passes the lifecycle
# receipt, including reclaim and recovery.
burn-remote = { path = "/Users/markik/Code/worktrees/mere-vello-cpu-source/support/patches/burn-remote" }
